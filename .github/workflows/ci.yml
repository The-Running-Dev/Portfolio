name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: docs

jobs:
  Artifacts:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the-running-dev/build-agent:latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transpile
        run: node-build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/artifacts