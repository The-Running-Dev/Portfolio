preBuild:
  projectRoot: ./
  overwriteExistingFiles: true
  copyMarkdownFromProjectRoot: false
  generateNavBarForPages: false
  defaultTheme: portfolio

site:
  title: Portfolio
  tagline: Technical Projects & Experience
  url: https://portfolio.subzerodev.com
  baseUrl: /
  organizationName: The-Running-Dev
  projectName: Portfolio

theme:
  navbar:
    title: Portfolio
    logo:
      alt: Portfolio
      src: img/logo.svg

features:
  giscusComments: false
  gitHubLinks: false
  navBarLinks: false
  badges: false
  themeSwitcher: false
  textSizeSwitcher: true
  readerMode: true
  versionDisplay: true
  cvPage: true
  portfolioPage: true
  portfolioPageAsIndex: true
  projectsPage: true
  dataCaching: true
  adminUI: false

projectsPage:
  source: https://the-running-dev.github.io/Data/portfolio/projects.json

portfolioPage:
  source: https://the-running-dev.github.io/Data/portfolio/portfolioData.json

cvPage:
  source: https://the-running-dev.github.io/Data/portfolio/cvData.json
